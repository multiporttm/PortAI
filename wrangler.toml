# Cloudflare Pages configuration for PortAI.
#
# Note: when this file exists, Cloudflare uses it (not the dashboard) for
# bindings and plain variables. Edit them here. Secrets still go in the dashboard.

name = "portai"
compatibility_date = "2026-10-01"
pages_build_output_dir = "public"

# Workers AI binding (only used by models whose id starts with "@cf/").
[ai]
binding = "AI"

# D1 database for accounts + end-to-end encrypted chat sync.
# Schema: migrations/0001_accounts.sql
[[d1_databases]]
binding = "DB"
database_name = "portai-db"
database_id = "09b2911a-bcea-4995-aaa9-4f28d00b18a9"

[vars]
# FREE + PRIVATE: open models hosted by Cloudflare Workers AI on the free plan,
# with zero data retention. No API key needed. The first model is the default.
PORTAI_MODELS = "@cf/google/gemma-4-26b-a4b-it,@cf/zai-org/glm-4.7-flash"
# Port 1.1 = Gemma 4 (default) · Port 1.0 = GLM-4.7 Flash
PORTAI_MODEL_LABELS = "Port 1.1,Port 1.0"

# Apertus (Swiss open model) - switch back when Cloudflare gives your account
# access (it currently returns error 5018):
#   PORTAI_MODELS = "@cf/swiss-ai/apertus-v1.5-8b"
#   PORTAI_MODEL_LABELS = "Apertus 8B"
#
# Apertus via Public AI (paid after $2 free credit; needs PORTAI_API_KEY secret):
#   PORTAI_MODELS = "swiss-ai/apertus-v1.5-8b,swiss-ai/apertus-v1.5-70b"
PORTAI_API_BASE = "https://api.publicai.co/v1"
